<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 480" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mw-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001B40"/>
      <stop offset="55%" stop-color="#0A2A5C"/>
      <stop offset="100%" stop-color="#123A78"/>
    </linearGradient>
    <linearGradient id="mw-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAF4FC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9EC8EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mw-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA8E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6BC8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Light upper ribbon -->
  <path d="M-20 40 C100 -10 200 60 320 30 C440 0 520 70 640 40 C720 20 780 50 820 70 L820 140 C700 90 560 160 420 110 C300 70 160 150 -20 100 Z" fill="url(#mw-light)"/>
  <!-- Dark quote wave (left mass) -->
  <path d="M-30 80 C40 40 90 90 120 160 C150 230 90 300 40 340 C10 360 -40 340 -40 280 L-40 100 Z
           M-30 80 C80 100 160 60 240 100 C320 140 280 220 220 280 C160 340 60 360 -20 320 C-40 300 -40 200 -30 80 Z" fill="url(#mw-dark)"/>
  <path d="M-20 120 C60 90 130 140 180 200 C230 260 170 330 90 360 C30 380 -40 340 -40 280 C-40 200 -20 150 -20 120 Z" fill="url(#mw-dark)"/>
  <!-- Soft white foam over dark -->
  <path d="M0 200 C80 160 140 210 200 190 C260 170 300 230 340 210" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <path d="M20 240 C100 200 160 260 230 230 C290 200 330 270 390 240" stroke="#D6EBFA" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <!-- Mid blue ribbon arcing under number / toward leaderboard -->
  <path d="M200 40 C320 0 400 80 520 50 C620 25 700 80 820 60 L820 160 C700 120 580 180 460 140 C360 110 280 160 200 120 Z" fill="url(#mw-mid)" opacity="0.45"/>
  <!-- Right soft wash behind leaderboard -->
  <path d="M480 200 C560 160 640 220 740 180 C800 160 840 200 840 260 L840 400 C760 340 660 380 560 340 C500 320 460 280 480 200 Z" fill="url(#mw-light)" opacity="0.5"/>
</svg>
