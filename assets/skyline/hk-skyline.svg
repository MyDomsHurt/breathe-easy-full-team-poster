    <rect x="298" y="70" width="9" height="40"/>
    <rect x="312" y="52" width="13" height="58"/>
    <rect x="330" y="64" width="10" height="46"/>
    <rect x="346" y="45" width="15" height="65"/>
    <rect x="366" y="68" width="10" height="42"/>
    <rect x="382" y="55" width="12" height="55"/>
    <rect x="400" y="72" width="9" height="38"/>
