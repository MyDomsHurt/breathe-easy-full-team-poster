<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 160" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F3FC" stop-opacity="0"/>
      <stop offset="40%" stop-color="#C5DFF5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8EBFEA" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D4F5"/>
      <stop offset="55%" stop-color="#6BAEE8"/>
      <stop offset="100%" stop-color="#3D8AD0"/>
